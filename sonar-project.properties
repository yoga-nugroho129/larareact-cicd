# Project identification
sonar.projectKey=larareact-cicd
sonar.projectName=Laravel React CI/CD
sonar.sourceEncoding=UTF-8

# Source directories
sonar.sources=app,bootstrap,config,database,routes,resources,public

# Test directories
sonar.tests=tests
sonar.test.inclusions=tests/**/*.php

# Exclusions
sonar.exclusions=vendor/**,node_modules/**,public/build/**,storage/**,bootstrap/cache/**,**/*.min.js