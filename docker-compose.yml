# ==============================================================================
# Main compose for REAL USAGE
# ==============================================================================

services:
    laravel:
        image: larareact-cicd:v4
        container_name: larareact
        restart: unless-stopped

    nginx:
        image: nginx:alpine
        container_name: larareact-nginx
        restart: unless-stopped
        ports:
            - "80:80"
        volumes:
            - ./public:/var/www/public:ro
            - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            - laravel
