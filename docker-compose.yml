# ==============================================================================
# Main compose for REAL USAGE
# ==============================================================================

services:
    laravel:
        image: yoganugroho129/larareact-cicd:laravel-v1
        container_name: larareact
        restart: unless-stopped

        environment:
            APP_ENV: production
            APP_DEBUG: false
            APP_KEY: ${APP_KEY}

            DB_CONNECTION: mysql
            DB_HOST: mysql
            DB_PORT: 3306
            DB_DATABASE: ${DB_DATABASE}
            DB_USERNAME: ${DB_USERNAME}
            DB_PASSWORD: ${DB_PASSWORD}

        depends_on:
            mysql:
                condition: service_healthy

    nginx:
        image: yoganugroho129/larareact-cicd:nginx-v1
        container_name: larareact-nginx
        restart: unless-stopped

        ports:
            - "80:80"

        depends_on:
            - laravel

    mysql:
        image: mysql:8.4
        container_name: larareact-mysql
        restart: unless-stopped

        environment:
            MYSQL_DATABASE: ${DB_DATABASE}
            MYSQL_USER: ${DB_USERNAME}
            MYSQL_PASSWORD: ${DB_PASSWORD}
            MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}

        volumes:
            - mysql-data:/var/lib/mysql

        healthcheck:
            test:
                [
                    "CMD",
                    "mysqladmin",
                    "ping",
                    "-h",
                    "localhost",
                    "-u",
                    "root",
                    "-p${MYSQL_ROOT_PASSWORD}",
                ]
            interval: 10s
            timeout: 5s
            retries: 5

volumes:
    mysql-data:
