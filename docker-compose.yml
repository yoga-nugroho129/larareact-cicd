# ==============================================================================
# Main compose for REAL USAGE
# ==============================================================================

services:
    laravel:
        image: larareact-cicd:v4
        container_name: larareact
        restart: unless-stopped

        environment:
            APP_ENV: production
            APP_DEBUG: false
            APP_KEY: ${APP_KEY}

            DB_CONNECTION: mysql
            DB_HOST: mysql
            DB_PORT: 3306
            DB_DATABASE: ${DB_DATABASE}
            DB_USERNAME: ${DB_USERNAME}
            DB_PASSWORD: ${DB_PASSWORD}

    nginx:
        image: nginx:alpine
        container_name: larareact-nginx
        restart: unless-stopped
        ports:
            - "80:80"
        volumes:
            - ./public:/var/www/public:ro
            - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            - laravel

    mysql:
        image: mysql:8.4
        container_name: larareact-mysql
        restart: unless-stopped

        environment:
            MYSQL_DATABASE: ${DB_DATABASE}
            MYSQL_USER: ${DB_USERNAME}
            MYSQL_PASSWORD: ${DB_PASSWORD}
            MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}

        volumes:
            - mysql-data:/var/lib/mysql

volumes:
    mysql-data:
